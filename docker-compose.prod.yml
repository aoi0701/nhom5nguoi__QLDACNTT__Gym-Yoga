version: '3.8'
# Cloud Production Docker Compose Configuration
# WBS 4.52 / SCRUM-191
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: gymyoga_db
      POSTGRES_USER: gymyoga_user
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"

volumes:
  postgres_data:
